[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgehunter"
dynamic = ["version"]
description = "Oracle-aware counterexample search engine for Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PrathamKapoor", email = "prathamkapoor027@gmail.com" }]
keywords = [
    "counterexample-search",
    "edge-cases",
    "property-based-testing",
    "static-analysis",
    "testing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    # Validates the GitHub Actions workflow files without an online round trip.
    "pyyaml>=6",
    "ruff>=0.6",
]

[project.scripts]
edgehunter = "edgehunter.cli:main"

[tool.setuptools.dynamic]
version = { attr = "edgehunter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The Dockerfile is the container-side runtime the worker image is built from.
edgehunter = ["runtime/Dockerfile"]
# The benchmark corpus ships so a wheel install can still reproduce the numbers.
"edgehunter.benchmark" = ["fixtures/*.py"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: starts real Docker containers; skipped when Docker is unusable",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The benchmark fixtures are deliberately-written *targets*, not library code:
# they are excluded from the project's own lint and type gates for the same
# reason test fixtures are, so a fixture cannot be "fixed" into passing.
extend-exclude = ["src/edgehunter/benchmark/fixtures"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true
exclude = ["src/edgehunter/benchmark/fixtures/"]
